# All messages support MiniMessage formatting.
# Available custom gradient tags: <primary>, <secondary>, <success>, <danger>.
messages:
  no-permission: "<danger>You do not have permission to do that.</danger>"
  plugin-inactive: "<danger>WorldLoader is disabled. An administrator can enable it with <white>/wl enable</white>.</danger>"
  plugin-enabled: "<success>WorldLoader has been enabled.</success>"
  plugin-disabled: "<success>WorldLoader has been disabled. Unloaded <white><count></white> managed world(s).</success>"
  plugin-already-enabled: "<secondary>WorldLoader is already enabled.</secondary>"
  plugin-already-disabled: "<secondary>WorldLoader is already disabled.</secondary>"
  plugin-disable-failed: "<danger>WorldLoader could not be disabled because at least one managed world could not be unloaded.</danger>"
  plugin-state-save-failed: "<danger>The WorldLoader state could not be saved. The previous state has been restored.</danger>"
  plugin-state-usage: "<danger>Use <white>/wl enable</white> or <white>/wl disable</white>.</danger>"
  initializing: "<secondary>WorldLoader is still loading its local storage.</secondary>"
  players-only: "<danger>This command can only be used by players.</danger>"
  invalid-name: "<danger>The name <white><name></white> is invalid. Letters, numbers, underscores and hyphens are allowed.</danger>"
  invalid-id: "<danger>Use the format <white>dimension:world</white>.</danger>"
  invalid-type: "<danger>Unknown world type. Available types: <white>air, flat, normal</white>.</danger>"
  blacklisted: "<danger><name></danger> <gray>is blacklisted and cannot be managed.</gray>"
  dimension-created: "<success>Dimension <white><dimension></white> has been created.</success>"
  dimension-exists: "<danger>A case-insensitive dimension match already exists as <white><dimension></white>.</danger>"
  dimension-missing: "<danger>Dimension <white><dimension></white> does not exist. Create it first with <white>/wl create dimension <dimension></white>.</danger>"
  world-created: "<success>World <white><world></white> has been created and loaded as <type>.</success>"
  world-exists: "<danger>A case-insensitive world match already exists as <white><world></white>.</danger>"
  world-missing: "<danger>World <white><world></white> is not registered.</danger>"
  world-loaded: "<success>World <white><world></white> has been loaded.</success>"
  world-already-loaded: "<secondary>World <white><world></white> is already loaded.</secondary>"
  world-unloaded: "<success>World <white><world></white> has been unloaded.</success>"
  dimension-unloaded: "<success>Unloaded <white><count></white> world(s) from dimension <white><dimension></white>.</success>"
  world-in-use: "<danger>World <white><world></white> is still in use by players.</danger>"
  dimension-in-use: "<danger>At least one world in <white><dimension></white> is still in use by players.</danger>"
  world-load-failed: "<danger>World <white><world></white> could not be loaded. Check the console for details.</danger>"
  world-unload-failed: "<danger>World <white><world></white> could not be unloaded.</danger>"
  type-mismatch: "<danger>Stored type: <white><expected></white>. Requested type: <white><actual></white>.</danger>"
  teleported: "<success>You have been teleported to <white><world></white>.</success>"
  import-complete: "<success>Imported dimension <white><dimension></white> with <white><count></white> world(s).</success>"
  import-empty: "<danger>No valid world folders were found in <white><dimension></white>.</danger>"
  import-missing: "<danger>The copied dimension folder <white><dimension></white> was not found.</danger>"
  delete-world-question: "<danger>Permanently delete world <white><world></white>?</danger> <confirm>"
  delete-dimension-question: "<danger>Permanently delete dimension <white><dimension></white> and all of its worlds?</danger> <confirm>"
  delete-confirm-button: "<danger><bold>[DELETE PERMANENTLY]</bold></danger>"
  delete-confirm-hover: "<gray>Delete permanently</gray>"
  confirmation-expired: "<danger>This deletion confirmation is invalid or has expired.</danger>"
  world-deleted: "<success>World <white><world></white> has been permanently deleted.</success>"
  dimension-deleted: "<success>Dimension <white><dimension></white> and all of its worlds have been permanently deleted.</success>"
  delete-failed: "<danger>Deletion failed. Check the console for details.</danger>"
  reload-complete: "<success>The configuration and language file have been reloaded.</success>"
  reload-restart-required: "<secondary>The configuration was reloaded. Restart the server to apply storage.world-root or storage.file changes.</secondary>"
  storage-error: "<danger>Local storage failed. Check the console for details.</danger>"
  list-header: "<primary><bold>Dimensions & Worlds</bold></primary> <gray>– Page <page>/<pages></gray>"
  list-dimension: "<primary>◆ <dimension></primary> <dark_gray>(<count> worlds)</dark_gray>"
  list-world-loaded: "  <green>●</green> <world> <dark_gray>[<type>]</dark_gray> <click>"
  list-world-unloaded: "  <gray>○</gray> <world> <dark_gray>[<type>]</dark_gray> <click>"
  list-click: "<primary><bold>[Teleport]</bold></primary>"
  list-teleport-hover: "<gray>Teleport to <white><world></white></gray>"
  list-empty: "<secondary>No visible dimensions or worlds are registered.</secondary>"
  list-footer: "<gray>● loaded  ○ unloaded  • Click </gray><primary>[Teleport]</primary>"
  help:
    - "<primary><bold>WorldLoader Commands</bold></primary>"
    - "<gray>/wl create dimension </gray><white>name</white> <dark_gray>– Create a dimension</dark_gray>"
    - "<gray>/wl create </gray><white>dimension:world</white> <dark_gray>(air|flat|normal)</dark_gray>"
    - "<gray>/wl load </gray><white>dimension:world</white> <dark_gray>[air|flat|normal]</dark_gray>"
    - "<gray>/wl unload </gray><white>dimension:world</white>"
    - "<gray>/wl unload dimension </gray><white>name</white>"
    - "<gray>/wl tp </gray><white>dimension:world</white>"
    - "<gray>/wl list </gray><dark_gray>[page]</dark_gray>"
    - "<gray>/wl import dimension </gray><white>name</white> <dark_gray>[air|flat|normal]</dark_gray>"
    - "<gray>/wl delete </gray><white>dimension:world</white>"
    - "<gray>/wl delete universum </gray><white>dimension</white>"
    - "<gray>/wl enable</gray> <dark_gray>– Enable WorldLoader (requires worldloader.*)</dark_gray>"
    - "<gray>/wl disable</gray> <dark_gray>– Disable WorldLoader (requires worldloader.*)</dark_gray>"
    - "<gray>/wl reload</gray>"
